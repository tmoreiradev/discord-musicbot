# 2026-10-01: web_embedded como fallback de cliente. Videos que o chain padrao
# (tv/web_safari/web) devolve "Sign in to confirm you are not a bot" ainda extraem
# pelo player embutido (c=WEB_EMBEDDED_PLAYER). Videos normais continuam no VISIONOS.
--extractor-args "youtube:player_client=default,web_embedded"
