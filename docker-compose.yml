services:
  wireproxy:
    build:
      context: .
      dockerfile: Dockerfile.wireproxy
      network: host
    image: local/wireproxy
    container_name: wireproxy
    network_mode: host
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./warp:/etc/wireproxy:ro
    command: ["-c", "/etc/wireproxy/wireproxy.conf"]

  muse:
    build:
      context: .
      dockerfile: Dockerfile.muse
      network: host
    image: local/muse
    container_name: muse
    network_mode: host
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - wireproxy
    environment:
      - DISCORD_TOKEN=${DISCORD_BOT_TOKEN}
      - YOUTUBE_API_KEY=${GOOGLE_CLOUD_API}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - HTTP_PROXY=http://127.0.0.1:25345
      - HTTPS_PROXY=http://127.0.0.1:25345
      - http_proxy=http://127.0.0.1:25345
      - https_proxy=http://127.0.0.1:25345
      - DEBUG=muse
      - YT_DLP_AUTO_UPDATE=true
      - YT_DLP_COOKIES_PATH=/data/cookies.txt  # 2026-10-03: religado, bot-check amplo no IP do servidor (desligado 2026-08-27 por 403 web_embedded, hoje coberto pelo fallback ytdlp-stream)
    volumes:
      - ./data:/data

  events:
    build:
      context: .
      dockerfile: Dockerfile.events
    image: local/discord-events
    container_name: discord-events
    network_mode: host
    restart: unless-stopped
    mem_limit: 192m
    volumes:
      - ./:/app:ro
      - ./state:/app/state
